# Locks the app to one consistent, readable theme regardless of the
# viewer's OS/browser dark-mode setting -- this is what was causing the
# invisible sidebar labels (white text rendering on a light background).
[theme]
base = "light"
primaryColor = "#146c43"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fb"
textColor = "#1a1a1a"
font = "sans serif"
